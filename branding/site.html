<style>
  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }

  h1, h2, h3, h4 { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif; }

  /* Máscara do campo: laterais e topo dissolvidos, base perfeitamente nítida */
  .dt-field-mask {
    -webkit-mask-image: radial-gradient(55% 100% at bottom, black 5%, transparent 90%);
            mask-image: radial-gradient(55% 100% at bottom, black 5%, transparent 90%);
    -webkit-mask-repeat: no-repeat;
            mask-repeat: no-repeat;
  }

  /* Altura do hero: svh evita o salto da barra de endereço no mobile */
  .dt-hero-h { min-height: calc(100vh - 2rem); }
  @supports (height: 100svh) { .dt-hero-h { min-height: calc(100svh - 2rem); } }
  @media (min-width: 768px) {
    .dt-hero-h { min-height: calc(100vh - 3rem); }
    @supports (height: 100svh) { .dt-hero-h { min-height: calc(100svh - 3rem); } }
  }

  /* Cantos invertidos do cutout: mesmo gradiente nos dois quadrados,
     disco transparente ancorado no canto superior esquerdo (0 0).          */
  .dt-notch { background: radial-gradient(circle at 0 0, transparent 40px, #f2efe6 40px); }

  /* Pan lento do campo. Em px porque em SVG o % resolve contra a bbox.     */
  @keyframes dt-pan {
    from { transform: translate3d(-22px, 0, 0) scale(1.02); }
    to   { transform: translate3d(22px, 0, 0)  scale(1.07); }
  }
  .dt-pan { animation: dt-pan 48s ease-in-out infinite alternate; transform-origin: 50% 100%; }

  @keyframes dt-sweep {
    0%   { transform: translateX(-520px); opacity: 0; }
    35%  { opacity: .6; }
    100% { transform: translateX(2020px); opacity: 0; }
  }
  .dt-sweep { animation: dt-sweep 14s linear infinite; }

  @keyframes dt-pulse { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
  .dt-pulse { animation: dt-pulse 7s ease-in-out infinite; }

  @keyframes dt-rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  .dt-rise { animation: dt-rise .7s cubic-bezier(.22,.8,.28,1) both; }

  @keyframes dt-blink { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
  .dt-blink { animation: dt-blink 2.4s ease-in-out infinite; }

  /* Faixa de vocabulário: duas metades idênticas, -50% fecha o loop        */
  @keyframes dt-marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  .dt-marquee { animation: dt-marquee 26s linear infinite; }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .dt-pan, .dt-sweep, .dt-pulse, .dt-rise, .dt-blink, .dt-marquee { animation: none !important; }
  }
</style>
