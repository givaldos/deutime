name: WhatsApp worker

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: whatsapp-worker-production
  cancel-in-progress: false

jobs:
  dispatch:
    if: ${{ vars.WHATSAPP_AUTOMATION_ENABLED == 'true' }}
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Execute production worker
        env:
          WORKER_SECRET: ${{ secrets.WHATSAPP_WORKER_SECRET }}
        run: |
          if [ -z "$WORKER_SECRET" ]; then
            echo "WHATSAPP_WORKER_SECRET não configurado." >&2
            exit 1
          fi

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          http_code="$(curl --silent --show-error \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer $WORKER_SECRET" \
            'https://deutime.app/api/internal/whatsapp/worker')"

          if [ "$http_code" = "200" ] || [ "$http_code" = "409" ]; then
            echo "Worker concluído com estado operacional HTTP $http_code."
            echo "Resumo operacional redigido:"
            if ! jq --compact-output \
              --from-file .github/filters/whatsapp-worker-summary.jq \
              "$response_file"; then
              echo "Resposta operacional inválida ou não redigível." >&2
              exit 1
            fi
            exit 0
          fi

          echo "Worker indisponível: HTTP $http_code." >&2
          exit 1
