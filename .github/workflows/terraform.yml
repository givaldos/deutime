name: Terraform

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_CLOUD_ORGANIZATION: ${{ vars.TF_CLOUD_ORGANIZATION }}
  TF_WORKSPACE: ${{ vars.TF_WORKSPACE }}

jobs:
  terraform-check:
    name: terraform-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Use Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
      - name: Check formatting
        run: terraform fmt -check -recursive
      - name: Initialize providers without a backend
        run: terraform init -backend=false -input=false
        env:
          TF_CLOUD_ORGANIZATION: ""
          TF_WORKSPACE: ""
      - name: Validate configuration
        run: terraform validate

  terraform-plan:
    name: terraform-plan
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.ENABLE_TERRAFORM_APPLY == 'true'
    needs: terraform-check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production-plan
    defaults:
      run:
        working-directory: infra/terraform
    env:
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      VERCEL_API_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.INFRA_GITHUB_TOKEN }}
      TF_PLAN_ENCRYPTION_KEY: ${{ secrets.TF_PLAN_ENCRYPTION_KEY }}
      TF_VAR_supabase_organization_id: ${{ vars.SUPABASE_ORGANIZATION_ID }}
      TF_VAR_supabase_database_password: ${{ secrets.SUPABASE_DB_PASSWORD }}
      TF_VAR_app_url: ${{ vars.APP_URL }}
      TF_VAR_turnstile_site_key: ${{ secrets.TURNSTILE_SITE_KEY }}
      TF_VAR_turnstile_secret_key: ${{ secrets.TURNSTILE_SECRET_KEY }}
      TF_VAR_smtp_host: ${{ vars.SMTP_HOST }}
      TF_VAR_smtp_port: ${{ vars.SMTP_PORT || '587' }}
      TF_VAR_smtp_user: ${{ secrets.SMTP_USER }}
      TF_VAR_smtp_password: ${{ secrets.SMTP_PASSWORD }}
      TF_VAR_smtp_admin_email: ${{ vars.SMTP_ADMIN_EMAIL }}
      TF_VAR_smtp_sender_name: ${{ vars.SMTP_SENDER_NAME || 'DeuTime' }}
      TF_VAR_auth_email_rate_limit: ${{ vars.AUTH_EMAIL_RATE_LIMIT || '30' }}
      TF_VAR_twilio_account_sid: ${{ secrets.TWILIO_ACCOUNT_SID }}
      TF_VAR_twilio_auth_token: ${{ secrets.TWILIO_AUTH_TOKEN }}
      TF_VAR_twilio_message_service_sid: ${{ secrets.TWILIO_MESSAGE_SERVICE_SID }}
      TF_VAR_enable_github_ruleset: "true"
      TF_VAR_required_approvals: ${{ vars.REQUIRED_APPROVALS || '0' }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Use Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}
      - name: Initialize encrypted remote state
        run: terraform init -input=false
      - name: Create immutable plan
        run: terraform plan -input=false -out=tfplan
      - name: Render plan for review
        run: |
          terraform show -no-color tfplan > tfplan.txt
          sed -n '1,1200p' tfplan.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Encrypt immutable plan
        run: |
          sha256sum tfplan > tfplan.sha256
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 \
            -in tfplan \
            -out tfplan.enc \
            -pass env:TF_PLAN_ENCRYPTION_KEY
      - name: Upload reviewed plan artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: terraform-plan-${{ github.run_id }}
          path: |
            infra/terraform/tfplan.enc
            infra/terraform/tfplan.sha256
            infra/terraform/tfplan.txt
          if-no-files-found: error
          retention-days: 5

  terraform-apply:
    name: terraform-apply
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.ENABLE_TERRAFORM_APPLY == 'true'
    needs: terraform-plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production-apply
    defaults:
      run:
        working-directory: infra/terraform
    env:
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      VERCEL_API_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.INFRA_GITHUB_TOKEN }}
      TF_PLAN_ENCRYPTION_KEY: ${{ secrets.TF_PLAN_ENCRYPTION_KEY }}
      TF_CLOUD_ORGANIZATION: ${{ vars.TF_CLOUD_ORGANIZATION }}
      TF_WORKSPACE: ${{ vars.TF_WORKSPACE }}
    steps:
      - name: Checkout exact reviewed commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
      - name: Use Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}
      - name: Initialize encrypted remote state
        run: terraform init -input=false
      - name: Download reviewed plan artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: terraform-plan-${{ github.run_id }}
          path: infra/terraform
      - name: Decrypt and verify reviewed plan
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in tfplan.enc \
            -out tfplan \
            -pass env:TF_PLAN_ENCRYPTION_KEY
          sha256sum --check tfplan.sha256
      - name: Apply the exact reviewed plan
        run: terraform apply -input=false tfplan
