name: Smoke

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      target:
        description: Ambiente a verificar
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

jobs:
  production-readonly:
    name: smoke-production-readonly
    if: >-
      (github.event_name == 'deployment_status' &&
       github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Production') ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'production')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      APP_URL: ${{ vars.APP_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Verify essential public journeys without writes
        run: npm run smoke:production

  staging-write:
    name: smoke-staging-write
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'staging'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: staging
    env:
      APP_URL: ${{ vars.APP_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SMOKE_SYNTHETIC_TEAM_ID: ${{ vars.SMOKE_SYNTHETIC_TEAM_ID }}
      PRODUCTION_APP_URL: ${{ vars.PRODUCTION_APP_URL }}
      PRODUCTION_SUPABASE_URL: ${{ secrets.PRODUCTION_SUPABASE_URL }}
      PRODUCTION_SUPABASE_SECRET_KEY: ${{ secrets.PRODUCTION_SUPABASE_SECRET_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Verify isolated synthetic write
        run: npm run smoke:staging
