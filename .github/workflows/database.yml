name: Database

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: database-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  database:
    name: database
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
      - name: Protect existing migrations
        if: github.event_name == 'pull_request'
        run: node scripts/check-migration-integrity.mjs "origin/${{ github.base_ref }}" HEAD
      - name: Protect existing migrations on main
        if: github.event_name == 'push'
        run: node scripts/check-migration-integrity.mjs "${{ github.event.before }}" HEAD
      - name: Install Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          version: 2.109.1
      - name: Start local database
        run: supabase db start
      - name: Rebuild schema from migrations
        run: supabase db reset
      - name: Lint database
        run: supabase db lint --level warning
      - name: Test RLS and constraints
        run: supabase test db
      - name: Verify generated database types
        run: |
          supabase gen types typescript --local 2>/dev/null > /tmp/database.types.ts
          diff --strip-trailing-cr lib/database.types.ts /tmp/database.types.ts
